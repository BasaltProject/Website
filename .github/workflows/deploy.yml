name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: [self-hosted, basalt]
    steps:
      - name: Pull, build and restart
        run: |
          set -e
          cd /srv/apps/basaltmc/repo/Website
          git pull --ff-only
          npm ci
          npm run build
          systemctl --user restart basalt-web.service
